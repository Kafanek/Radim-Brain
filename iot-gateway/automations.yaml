# ==============================================
# Radim Care — Home Assistant Automations
# ==============================================
# Raspberry Pi 5 gateway: Zigbee sensors → Heroku IoT Bridge
#
# Prerequisites:
#   1. Home Assistant installed on Raspberry Pi 5
#   2. Zigbee2MQTT or ZHA integration configured
#   3. Add to secrets.yaml:
#        radim_api_url: "https://radim-brain-2025-be1cd52b04dc.herokuapp.com/api/iot-bridge"
#        radim_iot_token: "YOUR_IOT_GATEWAY_TOKEN_HERE"
#
# Installation:
#   Copy this file to /config/automations.yaml (or include via !include)
#   Restart Home Assistant
#
# Sensor naming convention:
#   sensor.zigbee_temp_A12    — temperature sensor in room A-12
#   binary_sensor.zigbee_motion_A12 — motion sensor in room A-12
#   binary_sensor.zigbee_door_A12   — door contact sensor
#   sensor.zigbee_humidity_A12      — humidity sensor
# ==============================================


# ============================================
# TEMPERATURE — every 5 minutes
# ============================================

- id: radim_temp_A12
  alias: "Radim: Teplota A-12 → Backend"
  description: "Odesílá teplotu z místnosti A-12 na Heroku každých 5 minut"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: state
      entity_id: sensor.zigbee_temp_A12
      state: "unavailable"
      match: false
  action:
    - service: rest_command.radim_iot_ingest
      data:
        device_id: "zigbee_temp_A12"
        room_id: "room_A12"
        sensor_type: "temperature"
        value: "{{ states('sensor.zigbee_temp_A12') | float }}"
        unit: "°C"


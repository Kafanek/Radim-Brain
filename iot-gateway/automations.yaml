# ============================================
# NO-MOTION WATCHDOG — every 30 min, checks if motion was seen
# ============================================
# If no motion detected in 2+ hours during daytime (6:00-22:00),
# sends value 0 to trigger "no_motion" alert

- id: radim_no_motion_watchdog
  alias: "Radim: Watchdog — žádný pohyb 2+ hodiny"
  description: "Kontroluje denní aktivitu seniorů"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/30"
  condition:
    - condition: time
      after: "06:00:00"
      before: "22:00:00"
  action:
    - repeat:
        for_each:
          - entity: binary_sensor.zigbee_motion_A12
            room: room_A12
            device: zigbee_motion_A12
          - entity: binary_sensor.zigbee_motion_A15
            room: room_A15
            device: zigbee_motion_A15
          - entity: binary_sensor.zigbee_motion_B03
            room: room_B03
            device: zigbee_motion_B03
          - entity: binary_sensor.zigbee_motion_B07
            room: room_B07
            device: zigbee_motion_B07
          - entity: binary_sensor.zigbee_motion_C01
            room: room_C01
            device: zigbee_motion_C01
        sequence:
          - condition: template
            value_template: >
              {{ (as_timestamp(now()) - as_timestamp(states[repeat.item.entity].last_changed)) > 7200 }}
          - service: rest_command.radim_iot_ingest
            data:
              device_id: "{{ repeat.item.device }}"
              room_id: "{{ repeat.item.room }}"
              sensor_type: "no_motion"
              value: "0"
              unit: "hours_inactive"

# ══════════════════════════════════════════════════════════════════
# Cloudflare Tunnel — Radim per-senior template
# ══════════════════════════════════════════════════════════════════
# Generated by radim-onsite-install.sh — DO NOT EDIT manually unless
# you know what you're doing. Re-run install script to regenerate.
#
# Substitution placeholders:
#   {{TUNNEL_UUID}}     — UUID returned by `cloudflared tunnel create`
#   {{TUNNEL_HOSTNAME}} — public hostname (e.g. radim-ha-babicka.radimcare.cz)
#   {{HA_LOCAL_PORT}}   — HA local port (default 8123)
#
# Place at: /etc/cloudflared/config.yml
# ══════════════════════════════════════════════════════════════════

tunnel: {{TUNNEL_UUID}}
credentials-file: /etc/cloudflared/{{TUNNEL_UUID}}.json

# Origin behavior — HTTP locally, HTTPS to Cloudflare edge
originRequest:
  connectTimeout: 30s
  tcpKeepAlive: 30s
  noTLSVerify: true          # HA serves self-signed cert internally
  http2Origin: false
  keepAliveConnections: 10
  keepAliveTimeout: 90s

# Routing rules — first match wins, must end with catch-all
ingress:
  # Senior's HA UI + REST API + WebSocket
  - hostname: {{TUNNEL_HOSTNAME}}
    service: http://localhost:{{HA_LOCAL_PORT}}
    originRequest:
      noTLSVerify: true
      # Pass Host header through so HA's CSRF / origin checks pass
      httpHostHeader: localhost:{{HA_LOCAL_PORT}}

  # MUST be last — anything not matched returns 404
  - service: http_status:404

# Metrics endpoint (for monitoring tunnel health)
metrics: 127.0.0.1:9876

# Connection retry — be patient, network can blip
retries: 5

# Edge connection settings
edge-ip-version: auto
protocol: auto              # quic preferred, http2 fallback

# Logging
loglevel: info
logfile: /var/log/cloudflared.log
